function matchView(){const sf=staffEffects(state);return `${heading('LIVE ARENA · SET '+(state.series.games.length+1),'협곡 위의 일곱 번째 선수.','감독과 코치의 준비가 교전·오브젝트·멘탈 관리로 이어집니다.')}<section class="live-score"><div>${badge(team())}<b>${team().id}</b><strong id="blue-kills">0</strong></div><div class="live-clock"><b id="game-time">00:00</b><small>${state.series.wins.join(' : ')} · BO${state.series.bestOf}</small></div><div><strong id="red-kills">0</strong><b>${match.opponent.id}</b>${badge(match.opponent)}</div></section><div class="live-layout"><section class="panel map-panel"><div class="map-toolbar"><span>◈ SUMMONER'S RIFT · ${match.userSide?'RED':'BLUE'} SIDE</span><div>${[1,2,4].map(s=>`<button class="chip ${speed===s?'selected':''}" data-action="speed" data-id="${s}">×${s}</button>`).join('')}</div></div><canvas id="rift" width="1100" height="900" aria-label="숲, 정글 캠프, 3개 라인, 미니언, 포탑과 실시간 선수 위치"></canvas><div class="objective-bar"><span>타워 <b id="tower-score"></b></span><span>드래곤 <b id="dragon-score"></b></span><span>바론 <b id="baron-score"></b></span><span>골드 <b id="gold-score"></b></span></div></section><div><section class="panel live-coaching"><p class="eyebrow">HEAD COACH · LIVE ORDERS</p><h2>${coaches(state)[0].name}의 전술실</h2><p id="calls-left">남은 지시 ${match.calls} / ${sf.calls}</p><div class="call-buttons">${[['fight','교전 집중','6틱 교전 우위'],['vision','오브젝트 운영','6틱 시야·오브젝트 우위'],['mental','멘탈 케어','체력 회복·연속 교전 안정']].map(([id,n,d])=>`<button class="secondary" data-action="call" data-id="${id}" ${match.calls<=0?'disabled':''}><b>${n}</b><small>${d}</small></button>`).join('')}</div><span id="active-call" class="muted"></span></section><section class="panel live-events"><div class="section-heading"><h2>경기 타임라인</h2><span>LIVE</span></div><div id="events"></div></section></div></div><section class="panel scoreboard"><div class="section-heading"><h2>선수 기록</h2><span>K / D / A · CS · GOLD · ITEMS</span></div><div id="player-scores"></div></section>`;}
function render(){if(renderer){renderer.destroy();renderer=null;}document.title=state?`${team().id} · RIFT OFFICE 2026`:'RIFT OFFICE · LCK 매니저';$('#app').innerHTML=!state?onboarding():shell(({dashboard,roster,scout,coaching,draft,match:matchView}[page]||dashboard)());sound.setMode(page==='draft'?'draft':page==='match'?'match':'lobby');if(page==='match'&&match){updateLive();renderer=new RiftRenderer($('#rift'),()=>match);if(!timer)startTimer();}scheduleDraft();}
function startMatch(){commitDraft(state);const d=state.draft,o=opponent(state),sf=staffEffects(state);match={tick:0,userSide:d.userSide,opponent:o,chance:winProbability(state,o.power),kills:[0,0],gold:[2500,2500],towers:[0,0],dragons:[0,0],barons:[0,0],calls:sf.calls,order:null,events:[{time:'00:00',side:0,text:'양 팀이 협곡에 입장합니다. 감독의 지시를 기다립니다.'}],players:[...selected(state).map((c,i)=>({name:c.name,role:c.role,champ:state.picks[i],group:0})),...o.players.map((name,i)=>({name,role:ROLES[i],champ:d.pick[1-d.userSide].find(p=>p.role===ROLES[i]).champ,group:1}))].map(p=>({...p,k:0,d:0,a:0,cs:0,gold:500,hp:100,respawn:0,x:(p.group===0?d.userSide:1-d.userSide)?.88:.12,y:(p.group===0?d.userSide:1-d.userSide)?.12:.88}))};state.pendingMatch=match;save();page='match';render();}

function clock(t){return `${String(Math.floor(t/2)).padStart(2,'0')}:${t%2?'30':'00'}`;}
function addEvent(side,text){match.events.unshift({side,text,time:clock(match.tick)});match.events=match.events.slice(0,25);}
function issueCall(type){if(!match||match.calls<=0)throw new Error('남은 전술 지시가 없습니다.');if(match.order&&match.order.until>match.tick)throw new Error('현재 지시가 끝나면 다음 지시를 내릴 수 있습니다.');match.calls--;match.order={type,until:match.tick+6};if(type==='mental')match.players.filter(p=>p.group===0).forEach(p=>p.hp=Math.min(100,p.hp+35));addEvent(0,`${coaches(state)[0].name} 감독: ${type==='fight'?'교전 집중':type==='vision'?'오브젝트 확보':'멘탈 케어'} 지시`);sound.effect('call');save();updateLive();}
function tick(){if(!match)return;const m=match;m.tick++;const sf=staffEffects(state);const order=m.order&&m.order.until>=m.tick?m.order.type:null;
 let chance=m.chance+(order==='fight'?.14:order==='mental'?.06:0)+(state.strategy==='early'&&m.tick<24?.05:state.strategy==='teamfight'&&m.tick>=24?.04:0)+(m.gold[0]-m.gold[1])/200000;chance=Math.max(.1,Math.min(.9,chance));const side=Math.random()<chance?0:1;
 m.players.forEach((p,i)=>{const physical=p.group===0?m.userSide:1-m.userSide;if(p.respawn>0){p.respawn--;p.x=physical?.88:.12;p.y=physical?.12:.88;p.hp=p.respawn?0:100;return;}p.cs+=p.role==='SUPPORT'?Math.round(Math.random()):3+Math.floor(Math.random()*3);p.gold+=p.role==='SUPPORT'?105:150+Math.floor(Math.random()*40);p.hp=Math.min(100,p.hp+6);let pos;
 if(m.tick<26){if(p.role==='JUNGLE'){const camps=[[.26,.53],[.38,.75],[.4,.62],[.48,.77]];pos=[...camps[Math.floor(m.tick/4)%4]];if(physical)pos=pos.map(v=>1-v);}else{const lane=p.role==='TOP'?0:p.role==='MID'?1:2;pos=lanePoint(lane,.5+(physical?.03:-.03)+Math.sin(m.tick*.7+i)*.024);if(p.role==='SUPPORT'){pos[0]+=.012;pos[1]+=.02;}}}
 else{const phase=Math.floor(m.tick/8)%3,center=phase===0?[.67,.67]:phase===1?[.34,.32]:[.5,.5];pos=[center[0]+Math.sin(m.tick*.35+i)*.09,center[1]+Math.cos(m.tick*.35+i)*.09];if(m.tick>58){const lead=m.gold[0]>m.gold[1]?0:1,dir=(lead===0?m.userSide:1-m.userSide)?-1:1;pos[0]+=dir*.12;pos[1]-=dir*.12;}}p.x=pos[0];p.y=pos[1];});
 if(m.tick%3===0){const alive=m.players.filter(p=>p.group===side&&!p.respawn),enemies=m.players.filter(p=>p.group!==side&&!p.respawn);if(alive.length&&enemies.length){const killer=alive[Math.floor(Math.random()*alive.length)],victim=enemies[Math.floor(Math.random()*enemies.length)];killer.k++;killer.gold+=300;killer.hp=Math.max(20,killer.hp-25);victim.d++;victim.hp=0;victim.respawn=3;m.kills[side]++;m.players.filter(p=>p.group===side&&p!==killer&&!p.respawn).forEach(p=>{if(Math.random()<.7){p.a++;p.gold+=50;}});m.battle={x:killer.x,y:killer.y};addEvent(side,`${killer.name} → ${victim.name} 처치${m.tick>26?' · 한타 교전':''}`);sound.effect('kill');}}
 const objChance=Math.max(.1,Math.min(.9,m.chance+(sf.objectives-5)*.008+(order==='vision'?.2:0)+(state.strategy==='vision'?.05:0)));
 if(m.tick%12===0){const owner=Math.random()<objChance?0:1;m.dragons[owner]++;m.players.filter(p=>p.group===owner).forEach(p=>p.gold+=120);addEvent(owner,`${owner===0?team().id:m.opponent.id} 드래곤 확보 · ${m.dragons[owner]}스택`);sound.effect('objective');}
 if(m.tick>14&&m.tick%7===0&&m.towers[side]<11){m.towers[side]++;m.players.filter(p=>p.group===side).forEach(p=>p.gold+=200);addEvent(side,`${side===0?team().id:m.opponent.id} 포탑 파괴 · 라인 전진`);}
 if([44,60].includes(m.tick)){const owner=Math.random()<objChance?0:1;m.barons[owner]++;m.players.filter(p=>p.group===owner).forEach(p=>p.gold+=300);addEvent(owner,`${owner===0?team().id:m.opponent.id} 바론 확보!`);sound.effect('objective');}
 m.gold=[0,1].map(s=>m.players.filter(p=>p.group===s).reduce((n,p)=>n+p.gold,0));updateLive();if(m.tick%4===0)save();
 if(m.tick>=72){clearInterval(timer);timer=null;const score=[0,1].map(s=>m.gold[s]+m.towers[s]*1500+m.dragons[s]*800+m.barons[s]*1500);const won=score[0]>=score[1],summary={kills:[...m.kills],duration:36,gold:[...m.gold]};const reward=finishGame(state,won,summary);guideEvent('game');match=null;page='dashboard';modal={type:'reward',...reward,...summary};sound.effect(won?'win':'loss');save();render();}}
function updateLive(){if(!$('#rift')||!match)return;const m=match;$('#game-time').textContent=clock(m.tick);$('#blue-kills').textContent=m.kills[0];$('#red-kills').textContent=m.kills[1];$('#tower-score').textContent=m.towers.join(' : ');$('#dragon-score').textContent=m.dragons.join(' : ');$('#baron-score').textContent=m.barons.join(' : ');$('#gold-score').textContent=m.gold.map(n=>(n/1000).toFixed(1)+'k').join(' : ');$('#calls-left').textContent=`남은 지시 ${m.calls} / ${staffEffects(state).calls}`;$('#active-call').textContent=m.order&&m.order.until>=m.tick?`지시 적용 중 · ${m.order.until-m.tick+1}틱 남음`:'';document.querySelectorAll('[data-action="call"]').forEach(b=>b.disabled=m.calls<=0||!!(m.order&&m.order.until>=m.tick));$('#events').innerHTML=m.events.slice(0,7).map(e=>`<div class="event ${e.side?'red':'blue'}"><small>${e.time}</small><p>${esc(e.text)}</p></div>`).join('');$('#player-scores').innerHTML=`<table><thead><tr><th>선수 / 챔피언</th><th>포지션</th><th>K / D / A</th><th>CS</th><th>골드</th><th>장비 단계</th></tr></thead><tbody>${m.players.map(p=>`<tr><td><i class="player-dot ${p.group?'red':'blue'}"></i><b>${p.name}</b><small>${p.champ}</small></td><td>${p.role}</td><td>${p.k} / ${p.d} / ${p.a}</td><td>${p.cs}</td><td>${fmt(p.gold)}</td><td>${['◈','✦','⚔','◉'].filter((_,i)=>p.gold>i*3000).map((v,i)=>`<span class="item-icon ${i%2?'purple':'gold'}">${v}</span>`).join('')}</td></tr>`).join('')}</tbody></table>`;}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`RIFT-OFFICE-${state.teamId}-save.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importSave(file){if(file.size>5*1024*1024)throw new Error('5 MB 이하의 저장 파일만 지원합니다.');const raw=JSON.parse(await file.text()),s=migrateState(raw);if(!s)throw new Error('올바른 저장 파일이 아닙니다.');const known=[...CATALOG,...newGame(s.teamId).inventory,...newGame(s.teamId).inventory.map(c=>({...c,id:c.id.replace('-2026',''),year:2024}))];const safeCards=[];for(const c of s.inventory){const model=known.find(x=>x.id===c.id);if(!model)throw new Error('알 수 없는 카드가 포함되어 있습니다.');safeCards.push({...structuredClone(model),training:Math.max(0,Math.min(10,Number(c.training)||0)),condition:Math.max(65,Math.min(100,Number(c.condition)||100))});}if(!['LCK','MSI','PLAYOFFS','WORLDS'].includes(s.stage))throw new Error('대회 정보가 올바르지 않습니다.');for(const [i,id]of s.lineup.entries())if(safeCards.find(c=>c.id===id)?.role!==ROLES[i])throw new Error('로스터가 올바르지 않습니다.');for(const [i,id]of s.staff.entries())if(safeCards.find(c=>c.id===id)?.role!==['감독','코치'][i])throw new Error('스태프가 올바르지 않습니다.');const fresh=newGame(s.teamId);fresh.inventory=safeCards;fresh.lineup=s.lineup;fresh.staff=s.staff;for(const k of ['coins','season','round','wins','losses','packs'])fresh[k]=Math.max(0,Math.min(100000000,Number(s[k])||0));fresh.stage=s.stage;fresh.year=YEARS.includes(s.year)?s.year:2026;fresh.trainedRound=typeof s.trainedRound==='string'?s.trainedRound:null;fresh.tutorial={step:7,done:true,rewarded:!!s.tutorial?.rewarded};for(const p of PACKS){fresh.packCounts[p.id]=Math.max(0,Math.floor(Number(s.packCounts[p.id])||0));fresh.vouchers[p.id]=Math.max(0,Math.min(10,Math.floor(Number(s.vouchers[p.id])||0)));}fresh.standings=TEAMS.map(t=>{const old=s.standings?.find(x=>x.id===t.id);return{id:t.id,w:Math.max(0,Math.min(9,Number(old?.w)||0)),l:Math.max(0,Math.min(9,Number(old?.l)||0))};});fresh.history=(s.history||[]).filter(h=>['LCK','MSI','PLAYOFFS','WORLDS'].includes(h.stage)&&/^[A-Z0-9]{1,5}$/.test(h.opponent)).slice(0,40).map(h=>({season:Number(h.season)||1,stage:h.stage,round:Number(h.round)||1,opponent:h.opponent,won:!!h.won,kills:Array.isArray(h.kills)?h.kills.slice(0,2).map(Number):[0,0],duration:Number(h.duration)||36}));fresh.portraits=Object.fromEntries(Object.entries(s.portraits||{}).filter(([name,v])=>known.some(c=>c.name===name)&&typeof v==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v)));clearInterval(timer);timer=null;match=null;state=fresh;modal=null;page='dashboard';save();render();toast('저장을 불러왔습니다. 진행 중 밴픽·매치는 해당 라운드 처음부터 재개합니다.');}
async function importPortrait(file,name){if(file.size>10*1024*1024)throw new Error('10 MB 이하 이미지를 선택하세요.');const uri=URL.createObjectURL(file);try{const img=new Image();img.src=uri;await img.decode();const c=document.createElement('canvas');c.width=280;c.height=320;const ctx=c.getContext('2d'),scale=Math.max(280/img.width,320/img.height);ctx.drawImage(img,(280-img.width*scale)/2,(320-img.height*scale)/2,img.width*scale,img.height*scale);state.portraits[name]=c.toDataURL('image/webp',.8);save();render();toast('같은 인물의 모든 시즌 카드에 사진이 적용되었습니다.');}finally{URL.revokeObjectURL(uri);}}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const {action,id}=b.dataset;try{
 if(state)await sound.unlock(state.audio);sound.effect('click');
 if(action==='choose'){state=newGame(id);await sound.unlock(state.audio);save();render();return;}
 if(action==='close'){modal=null;render();return;}
 if(action==='help'){modal={type:'help'};render();return;}
 if(action==='audio'){modal={type:'audio'};render();return;}
 if(action==='toggle-audio'){state.audio.enabled=!state.audio.enabled;sound.settings=state.audio;sound.setVolumes();if(state.audio.enabled)await sound.unlock(state.audio);save();render();return;}
 if(action==='remove-track'){sound.removeTrack(id);render();return;}
 if(action==='export-save'){exportSave();return;}
 if(action==='reset'){modal={type:'reset'};render();return;}
 if(action==='confirm-reset'){clearInterval(timer);timer=null;match=null;state=null;modal=null;page='dashboard';localStorage.removeItem(SAVE_KEY);render();return;}
 if(action==='guide-skip'){state.tutorial.done=true;save();render();return;}
 if(action==='guide-restart'){state.tutorial.done=false;state.tutorial.step=0;modal=null;save();render();return;}
 if(action==='guide-go'){const step=state.tutorial.step;if(step===7){if(!state.tutorial.rewarded){state.coins+=500;state.tutorial.rewarded=true;}state.tutorial.done=true;toast('튜토리얼 완료!');}else if(!match){page=GUIDE[step][2];if(step===0)state.tutorial.step=1;}modal=null;save();render();return;}
 if(match&&!['speed','call'].includes(action)){toast('현재 세트가 끝나면 관리 메뉴를 사용할 수 있습니다.');return;}
 if(action==='nav'){page=state.draft?'draft':id;filter='ALL';modal=null;window.scrollTo(0,0);if(state.draft&&id!=='draft')toast('밴픽을 완료하고 경기를 진행하세요.');}
 if(action==='detail'){modal={type:'detail',card:state.inventory.find(c=>c.id===id)||CATALOG.find(c=>c.id===id)};}
 if(action==='equip'){const c=state.inventory.find(c=>c.id===id);equip(state,id);if(!ROLES.includes(c.role))guideEvent('equip');modal=null;toast('라인업 등록 완료');}
 if(action==='train'){const sf=train(state);guideEvent('train');sound.effect('train');toast(`훈련 완료! 성장 +${sf.training}, 컨디션 +${sf.recovery}`);}
 if(action==='strategy'){if(state.draft)throw new Error('밴픽 전에 운영 방침을 설정하세요.');state.strategy=id;}
 if(action==='filter')filter=id;
 if(action==='pack-year')packYear=Number(id);
 if(action==='pack'){const result=openPack(state,id,packYear);if(id==='coaching')guideEvent('pack');modal={type:'pack',result,revealed:[]};sound.effect('pack');}
 if(action==='reveal'){if(!modal.revealed.includes(Number(id)))modal.revealed.push(Number(id));sound.effect('pack');}
 if(action==='reveal-all'){modal.revealed=modal.result.cards.map((_,i)=>i);sound.effect('pack');}
 if(action==='side')userSide=Number(id);
 if(action==='rules-year'){if(state.series)throw new Error('매치 중에는 규칙을 변경할 수 없습니다.');state.year=Number(id);}
 if(action==='begin-draft'){newDraft(state,userSide);guideEvent('draft');page='draft';chosenChampion=null;chosenRole=null;champFilter='ALL';}
 if(action==='champ-filter')champFilter=id;
 if(action==='draft-role'){chosenRole=id;champFilter=id;}
 if(action==='select-champ')chosenChampion=id;
 if(action==='lock-champ'){if(draftTurn(state.draft)[1]!==state.draft.userSide)throw new Error('상대 차례입니다.');if(!chosenChampion)throw new Error('챔피언을 선택하세요.');performDraft(chosenChampion,chosenRole);return;}
 if(action==='recommend'){if(draftTurn(state.draft)[1]!==state.draft.userSide)return;const r=recommendDraft(state);performDraft(r.name,r.role);return;}
 if(action==='start-match'){startMatch();return;}
 if(action==='speed'){speed=Number(id);startTimer();}
 if(action==='call'){issueCall(id);return;}
 if(action==='portrait-reset'){delete state.portraits[id];}
 save();render();
 }catch(err){toast(err.message);}});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.id==='season-filter'){seasonFilter=t.value;render();}if(t.id==='year-filter'){yearFilter=t.value;render();}if(t.dataset.swap){swapDraft(state,t.dataset.swap,t.value);save();render();}if(t.dataset.music&&t.files[0]){await sound.importTrack(t.files[0],t.dataset.music);render();toast('장면 음악이 적용되었습니다.');}if(t.id==='portrait-upload'&&t.files[0])await importPortrait(t.files[0],t.dataset.name);if(t.id==='import-save'&&t.files[0])await importSave(t.files[0]);}catch(err){toast(err.message);}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){query=t.value;const pos=t.selectionStart;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos);}catch{}}if(['music-volume','effects-volume'].includes(t.id)){state.audio[t.id==='music-volume'?'music':'effects']=Number(t.value);sound.settings=state.audio;sound.setVolumes();t.nextElementSibling.textContent=Math.round(t.value*100)+'%';save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal.type!=='reward'){modal=null;render();}});
render();if(state?.migrationNote){toast(state.migrationNote);delete state.migrationNote;save();}

})();
</script></body></html>
